# ESPHome configuration example for HeishaMon - ESP32
esphome:
  name: heishamon-esp32

esp32:
  board: esp32dev
  framework:
    type: arduino      # or wemos_d1_mini32, nodemcu-32s, etc.

# External HeishaMon component
external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  platform: esphome

# UART configuration for heat pump communication (ESP32)
uart:
  id: heisha_uart
  tx_pin: GPIO17     # TX pin for ESP32
  rx_pin: GPIO18     # RX pin for ESP32
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

# Main HeishaMon component
heishamon:
  id: heisha_main
  uart_id: heisha_uart
  update_interval: 30s
  listen_only: false     # false to allow sending commands
  optional_pcb: false    # true if you have optional PCB

# Temperature sensors
sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_inlet_temp"
    name: "Main Inlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_outlet_temp"
    name: "Main Outlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_target_temp"
    name: "Main Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_temp"
    name: "DHW Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_target_temp"
    name: "DHW Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "outside_temp"
    name: "Outside Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_freq"
    name: "Compressor Frequency"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_production"
    name: "Heat Power Production"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_consumption"
    name: "Heat Power Consumption"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "pump_flow"
    name: "Pump Flow"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "operation_mode"
    name: "Operation Mode"

  # Additional sensor for ESP32 - internal temperature
  - platform: internal_temperature
    name: "ESP32 Temperature"

# Binary sensors for states
binary_sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heatpump_state"
    name: "Heat Pump State"
    device_class: running

# GPIO to enable/disable transmission (ESP32)
output:
  - platform: gpio
    id: heisha_enable
    pin: GPIO5         # Enable pin for ESP32
  
  # Additional pin for OpenTherm control (if used)
  - platform: gpio
    id: heisha_ot_enable
    pin: GPIO4         # OpenTherm enable pin for ESP32

# Commands to control the heat pump
switch:
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_dhw"
    name: "Force DHW"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_defrost"
    name: "Force Defrost"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "holiday_mode"
    name: "Holiday Mode"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "heatpump_state"
    name: "Heat Pump State"

  # Switch to control GPIO activation
  - platform: output
    name: "HeishaMon Enable"
    output: heisha_enable
    restore_mode: RESTORE_DEFAULT_ON
    
  # Switch for OpenTherm control (if used)
  - platform: output
    name: "HeishaMon OT Enable"
    output: heisha_ot_enable
    restore_mode: RESTORE_DEFAULT_OFF

# Status LED for ESP32 (if available)
light:
  - platform: status_led
    name: "HeishaMon Status LED"
    pin: GPIO2         # Built-in LED ESP32

