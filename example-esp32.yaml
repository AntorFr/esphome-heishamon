# ESPHome configuration example for HeishaMon - ESP32
esphome:
  name: heishamon-esp32

esp32:
  board: esp32dev
  framework:
    type: arduino      # or wemos_d1_mini32, nodemcu-32s, etc.

# External HeishaMon component
external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  platform: esphome

# UART configuration for heat pump communication (ESP32)
uart:
  id: heisha_uart
  tx_pin: GPIO17     # TX pin for ESP32
  rx_pin: GPIO18     # RX pin for ESP32
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

# Main HeishaMon component
heishamon:
  id: heisha_main
  uart_id: heisha_uart
  update_interval: 30s
  listen_only: false     # false to allow sending commands
  optional_pcb: false    # true if you have optional PCB

# Temperature sensors
sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_inlet_temp"
    name: "Main Inlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_outlet_temp"
    name: "Main Outlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_target_temp"
    name: "Main Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_temp"
    name: "DHW Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_target_temp"
    name: "DHW Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "outside_temp"
    name: "Outside Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_freq"
    name: "Compressor Frequency"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_production"
    name: "Heat Power Production"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_consumption"
    name: "Heat Power Consumption"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "pump_flow"
    name: "Pump Flow"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "operation_mode"
    name: "Operation Mode"

  # PHASE 1: Advanced sensors
  # COP (Coefficient of Performance) - Very useful for efficiency monitoring
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "cop"
    name: "Coefficient of Performance (COP)"
    accuracy_decimals: 2
    
  # Separate power consumption/production by function
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_power_consumption"
    name: "DHW Power Consumption"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_power_production"
    name: "DHW Power Production"
    
  # Zone temperatures
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "z1_water_temp"
    name: "Zone 1 Water Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "z2_water_temp"
    name: "Zone 2 Water Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "room_thermostat_temp"
    name: "Room Thermostat Temperature"
    
  # Temperature deltas (useful for monitoring system efficiency)
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_delta"
    name: "Heat Delta Temperature"
    
  # Operating hours (maintenance indicators)
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_operating_hours"
    name: "Compressor Operating Hours"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_heater_operating_hours"
    name: "DHW Heater Operating Hours"
    
  # Zone valve control (for advanced systems)
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "z1_valve_pid"
    name: "Zone 1 Valve PID"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "z2_valve_pid"
    name: "Zone 2 Valve PID"

  # Additional sensor for ESP32 - internal temperature
  - platform: internal_temperature
    name: "ESP32 Temperature"

# Climate components (Thermostats)
climate:
  # Zone 1 Heating Thermostat
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 1 Heating"
    zone_id: 1
    supports_heat: true
    supports_cool: false
    
  # Zone 1 Cooling Thermostat (optional)
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 1 Cooling"
    zone_id: 1
    supports_heat: false
    supports_cool: true
    
  # Zone 2 Heating Thermostat
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 2 Heating"
    zone_id: 2
    supports_heat: true
    supports_cool: false
    
  # Zone 2 Cooling Thermostat (optional)
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 2 Cooling"
    zone_id: 2
    supports_heat: false
    supports_cool: true

# Binary sensors for states
binary_sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heatpump_state"
    name: "Heat Pump State"
    device_class: running
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "quiet_mode_schedule"
    name: "Quiet Mode Schedule"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "pump_running"
    name: "Pump Running"
    device_class: running
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "anti_freeze_mode"
    name: "Anti Freeze Mode"
    
  # Phase 2 binary sensors (commented until implemented)
  # - platform: heishamon
  #   heishamon_id: heisha_main
  #   topic: "external_backup_heater"
  #   name: "External Backup Heater"
  #   device_class: heat
  #   
  # - platform: heishamon
  #   heishamon_id: heisha_main
  #   topic: "bivalent_control"
  #   name: "Bivalent Control"

# GPIO to enable/disable transmission (ESP32)
output:
  - platform: gpio
    id: heisha_enable
    pin: GPIO5         # Enable pin for ESP32
  
  # Additional pin for OpenTherm control (if used)
  - platform: gpio
    id: heisha_ot_enable
    pin: GPIO4         # OpenTherm enable pin for ESP32

# Commands to control the heat pump
switch:
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_dhw"
    name: "Force DHW"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_defrost"
    name: "Force Defrost"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "holiday_mode"
    name: "Holiday Mode"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "buffer_installed"
    name: "Buffer Tank Installed"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "external_control"
    name: "External Control"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "bivalent_control"
    name: "Bivalent Control"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "quiet_mode"
    name: "Quiet Mode"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "heatpump_state"
    name: "Heat Pump State"

  # Switch to control GPIO activation
  - platform: output
    name: "HeishaMon Enable"
    output: heisha_enable
    restore_mode: RESTORE_DEFAULT_ON
    
  # Switch for OpenTherm control (if used)
  - platform: output
    name: "HeishaMon OT Enable"
    output: heisha_ot_enable
    restore_mode: RESTORE_DEFAULT_OFF

# Select entities for configuration
select:
  - platform: heishamon
    heishamon_id: heisha_main
    type: "bivalent_mode"
    name: "Bivalent Mode"
      
  - platform: heishamon
    heishamon_id: heisha_main
    type: "external_pad_heater_type"
    name: "External Pad Heater Type"
      
  - platform: heishamon
    heishamon_id: heisha_main
    type: "smart_grid_mode"
    name: "Smart Grid Mode"

# Number entities for precise controls (Phase 3)
number:
  - platform: heishamon
    heishamon_id: heisha_main
    type: "z1_heat_target_temp"
    name: "Zone 1 Heat Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    type: "z2_heat_target_temp"
    name: "Zone 2 Heat Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    type: "dhw_target_temp"
    name: "DHW Target Temperature"

# Status LED for ESP32 (if available)
light:
  - platform: status_led
    name: "HeishaMon Status LED"
    pin: GPIO2         # Built-in LED ESP32

