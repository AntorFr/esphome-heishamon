esphome:
  name: test-water-heater
  friendly_name: Test Water Heater Migration

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: "test_network"
  password: "testpassword"

uart:
  - id: uart_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1

external_components:
  - source:
      type: local
      path: components
    components: [heishamon]

heishamon:
  id: heisha_main
  uart_id: uart_bus
  update_interval: 30s
  listen_only: true

# Minimal sensor
sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_inlet_temp"
    name: "Main Inlet Temperature"

# Climate (zone heating only, no DHW)
climate:
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 1 Heating"
    zone_id: 1
    supports_heat: true
    supports_cool: false

# DHW as native water_heater platform
water_heater:
  - platform: heishamon
    heishamon_id: heisha_main
    name: "DHW Water Heater"
