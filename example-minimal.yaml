# HeishaMon ESPHome Minimal Example
# Use this to test basic connectivity before adding more entities

esphome:
  name: heishamon-minimal
  friendly_name: HeishaMon Minimal

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "HeishaMon-Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

external_components:
  - source:
      type: local
      path: components

# Main HeishaMon component
heishamon:
  id: heisha_main
  uart_id: uart_bus
  update_interval: 30s
  listen_only: true  # Read-only mode for testing

# Only essential sensors for testing
sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "outside_temp"
    name: "Outside Temperature"

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_temp"
    name: "DHW Temperature"

  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_freq"
    name: "Compressor Frequency"

binary_sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heatpump_state"
    name: "Heat Pump State"

# Single select for testing
select:
  - platform: heishamon
    heishamon_id: heisha_main
    type: "operating_mode"
    name: "Operating Mode"
