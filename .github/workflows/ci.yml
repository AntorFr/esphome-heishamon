name: ESPHome HeishaMon CI/CD

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'components/**'
      - 'example-*.yaml'
      - '*.md'
      - '.github/workflows/**'
  push:
    branches: [ dev ]
    paths:
      - 'components/**'
      - 'example-*.yaml'
      - '*.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Lint and Validate Configurations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install esphome flake8 black

    - name: Python code quality check
      run: |
        flake8 --max-line-length=120 --ignore=E203,W503 components/
        black --check --diff components/

    - name: Create test secrets
      run: |
        cat > secrets.yaml << EOF
        wifi_ssid: "test_network"
        wifi_password: "test_password"
        api_encryption_key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        ota_password: "test_password"
        fallback_password: "test_password"
        EOF

    - name: Validate example configurations
      run: |
        for f in example-*.yaml; do
          echo "::group::$f"
          esphome config "$f" > /dev/null
          echo "::endgroup::"
        done

  compile-test:
    name: Compile Test
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[compile]')
    strategy:
      matrix:
        example: [example-esp8266.yaml, example-full-featured.yaml]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install ESPHome
      run: |
        python -m pip install --upgrade pip
        pip install esphome

    - name: Create test secrets
      run: |
        cat > secrets.yaml << EOF
        wifi_ssid: "test_network"
        wifi_password: "test_password"
        api_encryption_key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        ota_password: "test_password"
        fallback_password: "test_password"
        EOF

    - name: Compile ${{ matrix.example }}
      run: timeout 20m esphome compile ${{ matrix.example }}

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check documentation completeness
      run: |
        required_files=("README.md" "docs/CLIMATE.md" "docs/DEBUGGING.md" "docs/WATER_HEATER.md" "example-esp8266.yaml" "example-full-featured.yaml")
        for file in "${required_files[@]}"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing required file: $file"
            exit 1
          fi
        done
        echo "✅ All required documentation files present"

    - name: Check example configurations have required sections
      run: |
        check() {
          local file=$1; shift
          for section in "$@"; do
            if ! grep -q "^$section" "$file"; then
              echo "❌ Missing section '$section' in $file"
              exit 1
            fi
          done
        }
        common=("esphome:" "uart:" "heishamon:" "sensor:" "binary_sensor:" "switch:")
        check example-esp8266.yaml "${common[@]}" "esp8266:"
        check example-full-featured.yaml "${common[@]}" "esp32:"
        echo "✅ All required sections present in examples"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run security scan
      run: |
        # Check for hardcoded secrets (basic check)
        if grep -r -i "password.*=" --include="*.yaml" --include="*.py" --include="*.cpp" --include="*.h" .; then
          echo "⚠️  Potential hardcoded credentials found. Please use secrets.yaml"
          # Don't fail the build, just warn
        fi

        # Check for TODO/FIXME comments that might indicate incomplete code
        if grep -r -n "TODO\|FIXME\|XXX" --include="*.py" --include="*.cpp" --include="*.h" components/; then
          echo "⚠️  Found TODO/FIXME comments in code"
          # Don't fail the build, just warn
        fi

        echo "✅ Basic security scan completed"

  merge-ready:
    name: Merge Ready Check
    runs-on: ubuntu-latest
    needs: [lint-and-validate, compile-test, documentation-check, security-scan]
    if: github.event_name == 'pull_request'

    steps:
    - name: All checks passed
      run: |
        echo "🎉 All CI checks passed!"
        echo "🚀 Ready to merge to main branch!"
