# ESPHome configuration example for HeishaMon - ESP8266
esphome:
  name: heishamon-esp8266

esp8266:
  board: d1_mini     # Wemos D1 Mini recommended

# External HeishaMon component
external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

ota:
  platform: esphome

# UART configuration for heat pump communication
uart:
  id: heisha_uart
  tx_pin: GPIO15  # D8 on Wemos D1 Mini (GPIO15)
  rx_pin: GPIO13  # D7 on Wemos D1 Mini (GPIO13)
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1

# Main HeishaMon component
heishamon:
  id: heisha_main
  uart_id: heisha_uart
  update_interval: 30s
  listen_only: false     # false to allow sending commands
  optional_pcb: false    # true if you have optional PCB

# Temperature sensors
sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_inlet_temp"
    name: "Main Inlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_outlet_temp"
    name: "Main Outlet Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "main_target_temp"
    name: "Main Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_temp"
    name: "DHW Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "dhw_target_temp"
    name: "DHW Target Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "outside_temp"
    name: "Outside Temperature"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_freq"
    name: "Compressor Frequency"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_production"
    name: "Heat Power Production"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heat_power_consumption"
    name: "Heat Power Consumption"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "pump_flow"
    name: "Pump Flow"
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "operation_mode"
    name: "Operation Mode"

  # PHASE 1: Essential advanced sensors (limited selection for ESP8266 memory)
  # COP is very useful for efficiency monitoring
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "cop"
    name: "Coefficient of Performance (COP)"
    accuracy_decimals: 2
    
  # Zone 1 temperature (most common zone)
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "z1_water_temp"
    name: "Zone 1 Water Temperature"
    
  # Operating hours for maintenance
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "compressor_operating_hours"
    name: "Compressor Operating Hours"

# Climate components (Thermostats)
climate:
  # Zone 1 Heating Thermostat
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 1 Heating"
    zone_id: 1
    supports_heat: true
    supports_cool: false
    
  # Zone 2 Heating Thermostat
  - platform: heishamon
    heishamon_id: heisha_main
    name: "Zone 2 Heating"
    zone_id: 2
    supports_heat: true
    supports_cool: false

# Binary sensors for states
binary_sensor:
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "heatpump_state"
    name: "Heat Pump State"
    device_class: running
    
  - platform: heishamon
    heishamon_id: heisha_main
    topic: "pump_running"
    name: "Pump Running"
    device_class: running

# GPIO to enable/disable transmission (optional)
output:
  - platform: gpio
    id: heisha_enable
    pin: GPIO5  # D1 on Wemos D1 Mini (GPIO5)

# Commands to control the heat pump
switch:
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_dhw"
    name: "Force DHW"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "force_defrost"
    name: "Force Defrost"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "holiday_mode"
    name: "Holiday Mode"
    
  - platform: heishamon
    heishamon_id: heisha_main
    command: "heatpump_state"
    name: "Heat Pump State"
    
  # Essential switches for ESP8266 (memory limited)
  - platform: heishamon
    heishamon_id: heisha_main
    command: "external_control"
    name: "External Control"

  # Switch to control GPIO activation
  - platform: output
    name: "HeishaMon Enable"
    output: heisha_enable
    restore_mode: RESTORE_DEFAULT_ON

# Select entities (limited for ESP8266 memory)
select:
  - platform: heishamon
    heishamon_id: heisha_main
    type: "bivalent_mode"
    name: "Bivalent Mode"

# Number entities (essential for ESP8266)
number:
  - platform: heishamon
    heishamon_id: heisha_main
    type: "dhw_target_temp"
    name: "DHW Target Temperature"
